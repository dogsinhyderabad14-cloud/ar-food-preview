<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRUTZ Restaurant OS v2</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
}

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 280px;
  background: #0b0b0b;
  color: white;
  padding: 22px;
  overflow-y: auto;
  border-right: 1px solid #222;
}

.logo {
  margin-bottom: 28px;
}

.logo h2 {
  color: #ff9800;
  margin: 0;
  font-size: 28px;
}

.logo p {
  color: #aaa;
  font-size: 13px;
  margin-top: 6px;
}

.nav-btn {
  width: 100%;
  padding: 14px 16px;
  margin: 6px 0;
  border: none;
  border-radius: 14px;
  text-align: left;
  cursor: pointer;
  font-weight: bold;
  background: transparent;
  color: #ddd;
  font-size: 15px;
}

.nav-btn:hover,
.nav-btn.active {
  background: linear-gradient(135deg, #ff9800, #ff5722);
  color: #111;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f4f4f4;
}

.topbar {
  height: 76px;
  background: white;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.topbar h2 {
  margin: 0;
}

.top-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.clock {
  background: #f4f4f4;
  padding: 10px 16px;
  border-radius: 20px;
  font-weight: bold;
}

.role {
  background: #111;
  color: white;
  padding: 10px 16px;
  border-radius: 20px;
  font-weight: bold;
}

iframe {
  flex: 1;
  border: none;
  width: 100%;
  background: #f4f4f4;
}

@media(max-width: 800px) {
  .app {
    flex-direction: column;
  }

  .sidebar {
    width: auto;
    max-height: 330px;
  }

  .topbar {
    height: auto;
    padding: 16px;
    gap: 10px;
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <h2>KRUTZ OS</h2>
      <p>Restaurant Operating System v2.0</p>
    </div>

    <button class="nav-btn active" onclick="openPage('owner.html', this, 'Owner Dashboard')">👑 Owner Dashboard</button>
    <button class="nav-btn" onclick="openPage('kitchen.html', this, 'Kitchen Display')">👨‍🍳 Kitchen</button>
    <button class="nav-btn" onclick="openPage('tables.html', this, 'Table Management')">🪑 Tables</button>
    <button class="nav-btn" onclick="openPage('waiter.html', this, 'Waiter Dashboard')">🧑‍🍳 Waiter</button>
    <button class="nav-btn" onclick="openPage('cashier.html', this, 'Cashier Pro')">🧾 Cashier</button>
    <button class="nav-btn" onclick="openPage('reservations.html', this, 'Reservations')">📅 Reservations</button>
    <button class="nav-btn" onclick="openPage('requests.html', this, 'Customer Requests')">🔔 Requests</button>
    <button class="nav-btn" onclick="openPage('notifications.html', this, 'Live Notifications')">🔔 Notifications</button>
    <button class="nav-btn" onclick="openPage('feedback.html', this, 'Customer Feedback')">⭐ Feedback</button>
    <button class="nav-btn" onclick="openPage('inventory.html', this, 'Inventory')">📦 Inventory</button>
    <button class="nav-btn" onclick="openPage('menu.html', this, 'Menu Management')">🍔 Menu</button>
    <button class="nav-btn" onclick="openPage('staff-management.html', this, 'Staff Management')">👥 Staff</button>
    <button class="nav-btn" onclick="openPage('index.html', this, 'Customer AR Menu')">📱 Customer Menu</button>
    <button class="nav-btn" onclick="openPage('ai-order.html', this, 'AI Waiter')">🤖 AI Waiter</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Owner Dashboard</h2>

      <div class="top-actions">
        <div class="clock" id="clock">--:--</div>
        <div class="role">Admin Mode</div>
      </div>
    </div>

    <iframe id="screen" src="owner.html"></iframe>
  </main>

</div>

<script>
function openPage(page, button, title) {
  document.getElementById("screen").src = page;
  document.getElementById("pageTitle").innerText = title;

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
