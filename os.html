<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRUTZ Restaurant OS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #080808;
  color: #111;
}

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 300px;
  background: linear-gradient(180deg, #080808, #151515);
  color: white;
  padding: 24px;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,.08);
}

.logo {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 28px;
}

.logo-icon {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: linear-gradient(135deg, #ff9800, #ff5722);
  display: grid;
  place-items: center;
  font-size: 28px;
  box-shadow: 0 12px 30px rgba(255,152,0,.35);
}

.logo h2 {
  color: #ff9800;
  font-size: 28px;
}

.logo p {
  color: #aaa;
  font-size: 13px;
  margin-top: 4px;
}

.section-label {
  color: #777;
  font-size: 12px;
  margin: 18px 0 8px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.nav-btn {
  width: 100%;
  padding: 14px 16px;
  margin: 5px 0;
  border: none;
  border-radius: 16px;
  text-align: left;
  cursor: pointer;
  font-weight: bold;
  background: transparent;
  color: #ddd;
  font-size: 15px;
  transition: .25s;
}

.nav-btn:hover,
.nav-btn.active {
  background: linear-gradient(135deg, #ff9800, #ff5722);
  color: #111;
  transform: translateX(4px);
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f4f4f4;
}

.topbar {
  height: 82px;
  background: rgba(255,255,255,.95);
  box-shadow: 0 6px 22px rgba(0,0,0,.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 5;
}

.topbar h2 {
  font-size: 26px;
}

.top-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.clock,
.role {
  padding: 11px 16px;
  border-radius: 999px;
  font-weight: bold;
}

.clock {
  background: #f1f1f1;
}

.role {
  background: #111;
  color: white;
}

.logout {
  background: #ff5722;
  color: white;
  border: none;
  padding: 11px 16px;
  border-radius: 999px;
  font-weight: bold;
  cursor: pointer;
}

iframe {
  flex: 1;
  border: none;
  width: 100%;
  background: #f4f4f4;
}

@media(max-width: 850px) {
  .app {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    max-height: 350px;
  }

  .topbar {
    height: auto;
    padding: 16px;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .top-actions {
    flex-wrap: wrap;
  }
}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">🍽</div>
      <div>
        <h2>KRUTZ OS</h2>
        <p>Role Based Workspace</p>
      </div>
    </div>

    <div id="navMenu"></div>

  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <h2 id="pageTitle">Loading...</h2>
        <p style="color:#777;margin-top:4px;">Live KRUTZ Restaurant OS workspace</p>
      </div>

      <div class="top-actions">
        <div class="clock" id="clock">--:--</div>
        <div class="role" id="roleBadge">Role</div>
        <button class="logout" onclick="logout()">Logout</button>
      </div>
    </div>

    <iframe id="screen"></iframe>

  </main>

</div>

<script>
const loggedIn = localStorage.getItem("loggedIn");
const role = localStorage.getItem("role");

if (!loggedIn || !role) {
  window.location.href = "login.html";
}

const roleName = role.charAt(0).toUpperCase() + role.slice(1);
document.getElementById("roleBadge").innerText = roleName;

const pages = {
  owner: [
  ["Control Center", "👑 Owner Dashboard", "owner.html", "Owner Dashboard"],
  ["Control Center", "📊 Manager Dashboard", "dashboard.html", "Manager Dashboard"],
  ["Operations", "👨‍🍳 Kitchen", "kitchen.html", "Kitchen Display"],
  ["Operations", "🪑 Waiter", "waiter.html", "Waiter Dashboard"],
  ["Operations", "🧾 Cashier", "cashier.html", "Cashier Pro"],
  ["Operations", "🪑 Tables", "tables.html", "Table Management"],
  ["Customer Experience", "📱 Customer Menu", "index.html", "Customer AR Menu"],
  ["Customer Experience", "🤖 AI Customer Assistant", "ai-chat.html", "AI Customer Assistant"],
  ["Management", "📅 Reservations", "reservations.html", "Reservations"],
  ["Management", "📦 Inventory", "inventory.html", "Inventory"],
  ["Management", "🍔 Menu", "menu.html", "Menu Management"],
  ["Management", "👥 Staff", "staff-management.html", "Staff Management"],
  ["Analytics", "📈 Analytics", "analytics.html", "Analytics Dashboard"],
  ["Analytics", "🤖 AI Owner Copilot", "ai-copilot.html", "AI Owner Copilot"]
],

 manager: [
  ["Operations", "👨‍🍳 Kitchen", "kitchen.html", "Kitchen Display"],
  ["Operations", "🪑 Waiter", "waiter.html", "Waiter Dashboard"],
  ["Operations", "🪑 Tables", "tables.html", "Table Management"],
  ["Customer Experience", "🤖 AI Customer Assistant", "ai-chat.html", "AI Customer Assistant"],
  ["Management", "📅 Reservations", "reservations.html", "Reservations"],
  ["Management", "🍔 Menu", "menu.html", "Menu Management"]
],
  kitchen: [
    ["Kitchen", "👨‍🍳 Kitchen Display", "kitchen.html", "Kitchen Display"]
  ],

waiter: [
  ["Waiter", "🧑‍🍳 Waiter Dashboard", "waiter.html", "Waiter Dashboard"],
  ["Waiter", "🪑 Table Map", "tables.html", "Table Management"],
  ["Waiter", "🔔 Requests", "requests.html", "Customer Requests"],
  ["Waiter", "🤖 AI Customer Assistant", "ai-chat.html", "AI Customer Assistant"]
],

  cashier: [
    ["Cashier", "🧾 Cashier Dashboard", "cashier.html", "Cashier Pro"],
    ["Cashier", "🪑 Tables", "tables.html", "Table Management"]
  ]
};

function buildNav() {
  const navMenu = document.getElementById("navMenu");
  const allowedPages = pages[role] || [];
  let html = "";
  let currentSection = "";

  allowedPages.forEach(function(item, index) {
    const section = item[0];
    const label = item[1];
    const page = item[2];
    const title = item[3];

    if (section !== currentSection) {
      currentSection = section;
      html += `<div class="section-label">${section}</div>`;
    }

    html += `
      <button
        class="nav-btn ${index === 0 ? "active" : ""}"
        onclick="openPage('${page}', this, '${title}')">
        ${label}
      </button>
    `;
  });

  navMenu.innerHTML = html;

  if (allowedPages.length > 0) {
    document.getElementById("screen").src = allowedPages[0][2];
    document.getElementById("pageTitle").innerText = allowedPages[0][3];
  }
}

function openPage(page, button, title) {
  document.getElementById("screen").src = page;
  document.getElementById("pageTitle").innerText = title;

  document.querySelectorAll(".nav-btn").forEach(function(btn) {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}

function logout() {
  if (confirm("Logout from KRUTZ Restaurant OS?")) {
    localStorage.removeItem("role");
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("loginTime");
    window.location.href = "login.html";
  }
}

buildNav();
setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
