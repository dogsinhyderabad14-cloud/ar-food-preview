<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRUTZ Restaurant Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fff2df;
}

.login-box{

width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.2);

}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

input{

width:100%;
padding:14px;
margin-bottom:18px;
font-size:17px;
border-radius:12px;
border:1px solid #ccc;

}

button{

width:100%;
padding:15px;
background:#111;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#333;

}

.demo{

margin-top:25px;
background:#f7f7f7;
padding:15px;
border-radius:12px;
font-size:14px;

}

.demo h3{

margin-bottom:10px;

}

.demo p{

margin:4px 0;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🍽 KRUTZ Restaurant OS</h1>

<p class="subtitle">
Staff Login
</p>

<input
id="username"
type="text"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div class="demo">

<h3>Demo Accounts</h3>

<p>👨‍🍳 kitchen / kitchen123</p>

<p>🧑‍🍳 waiter / waiter123</p>

<p>🧾 cashier / cashier123</p>

<p>👨‍💼 manager / manager123</p>

<p>👑 owner / owner123</p>

</div>

</div>

</div>

<script>

function login(){

const username=document.getElementById("username").value.toLowerCase();

const password=document.getElementById("password").value;

if(username==="kitchen" && password==="kitchen123"){

localStorage.setItem("role","kitchen");

window.location.href="kitchen.html";
}

else if(username==="cashier" && password==="cashier123"){

localStorage.setItem("role","cashier");

window.location.href="cashier.html";

}
else if(username==="waiter" && password==="waiter123"){

localStorage.setItem("role","waiter");

window.location.href="waiter.html";

}

else if(username==="manager" && password==="manager123"){

localStorage.setItem("role","manager");

window.location.href="os.html";

}

else if(username==="owner" && password==="owner123"){

localStorage.setItem("role","owner");

window.location.href="owner.html";

}

else{

alert("Wrong Username or Password");

}

}

</script>

</body>
</html>
