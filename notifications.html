<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRUTZ Notifications</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f4;
  color:#111;
  padding:25px;
}

.header{
  background:linear-gradient(135deg,#111,#222);
  color:white;
  padding:28px;
  border-radius:24px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.header h1{
  color:#ff9800;
  margin-bottom:8px;
  font-size:34px;
}

.header p{
  color:#ddd;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  padding:18px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.stat-card h3{
  color:#555;
  margin-bottom:8px;
}

.number{
  font-size:30px;
  font-weight:bold;
  color:#ff9800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.column{
  background:white;
  border-radius:20px;
  padding:18px;
  min-height:65vh;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.column h2{
  text-align:center;
  margin-bottom:16px;
}

.notification{
  background:#fff7ec;
  padding:15px;
  border-radius:16px;
  margin-bottom:15px;
  border-left:6px solid #ff9800;
}

.notification h3{
  margin-bottom:8px;
}

.notification p{
  margin:6px 0;
}

.high{
  border-left-color:red;
  background:#fff1f0;
}

.medium{
  border-left-color:#ff9800;
}

.low{
  border-left-color:green;
}

.done{
  background:green;
  color:white;
  border:none;
  padding:10px 14px;
  margin-top:8px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.open-btn{
  background:#111;
  color:white;
  border:none;
  padding:10px 14px;
  margin-top:8px;
  margin-left:5px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:20px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="header">
    <h1>🔔 KRUTZ Live Notification Center</h1>
    <p>Real-time alerts across the entire restaurant</p>
</div>

<div class="stats">

<div class="stat-card">
<h3>Total Alerts</h3>
<div class="number" id="totalAlerts">0</div>
</div>

<div class="stat-card">
<h3>Kitchen</h3>
<div class="number" id="kitchenAlerts">0</div>
</div>

<div class="stat-card">
<h3>Waiter</h3>
<div class="number" id="waiterAlerts">0</div>
</div>

<div class="stat-card">
<h3>Owner</h3>
<div class="number" id="ownerAlerts">0</div>
</div>

</div>

<div class="grid">

<div class="column">

<h2>👨‍🍳 Kitchen</h2>

<div id="kitchenNotifications">
Loading...
</div>

</div>

<div class="column">

<h2>🧑‍🍳 Waiter</h2>

<div id="waiterNotifications">
Loading...
</div>

</div>

<div class="column">

<h2>👑 Owner / Cashier</h2>

<div id="ownerNotifications">
Loading...
</div>

</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
onSnapshot,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const kitchenBox=document.getElementById("kitchenNotifications");
const waiterBox=document.getElementById("waiterNotifications");
const ownerBox=document.getElementById("ownerNotifications");

let ordersData=[];
let requestsData=[];

function notificationCard(title,message,type,id,source,priority,page){

return `

<div class="notification ${priority}">

<h3>${title}</h3>

<p>${message}</p>

<p><b>${type}</b></p>

${source==="request"
?`<button class="done" onclick="markRequestDone('${id}')">Done</button>`
:""}

<button
class="open-btn"
onclick="openModule('${page}')">

Open

</button>

</div>

`;

}

function openModule(page){

window.location.href=page;

}
function renderNotifications(){

let kitchenHTML="";
let waiterHTML="";
let ownerHTML="";

let kitchenCount=0;
let waiterCount=0;
let ownerCount=0;

ordersData.forEach(function(data){

const id=data.id;
const order=data.order;

const status=order.status||"Pending";
const paymentStatus=order.paymentStatus||"Unpaid";
const table=order.tableNumber||"-";
const items=order.items||{};

if(status==="Completed") return;

if(status==="Pending"){

kitchenCount++;

kitchenHTML+=notificationCard(

"🍔 New Order",

`Table ${table}<br>
Burger ${items.burger||0} |
Pizza ${items.pizza||0} |
Coffee ${items.coffee||0}`,

"Kitchen Order",

id,

"order",

"high",

"kitchen.html"

);

}

else if(status==="Ready"){

waiterCount++;

waiterHTML+=notificationCard(

"🍽 Food Ready",

`Serve Table ${table}`,

"Waiter Task",

id,

"order",

"medium",

"waiter.html"

);

}

else if(status==="Delivered" && paymentStatus!=="Paid"){

ownerCount++;

ownerHTML+=notificationCard(

"💳 Bill Pending",

`Collect ₹${order.totalAmount||0} from Table ${table}`,

"Cashier",

id,

"order",

"high",

"cashier.html"

);

}

if(paymentStatus==="Paid"){

ownerCount++;

ownerHTML+=notificationCard(

"✅ Payment Received",

`${order.paymentMethod||"Unknown"} payment received.`,

"Payment",

id,

"order",

"low",

"dashboard.html"

);

}

});

requestsData.forEach(function(data){

const id=data.id;
const req=data.request;

if(req.status==="Completed") return;

waiterCount++;

waiterHTML+=notificationCard(

"🔔 Customer Request",

`Table ${req.tableNumber}<br>${req.requestType}`,

"Customer",

id,

"request",

"high",

"waiter.html"

);

if(req.requestType==="Request Bill"){

ownerCount++;

ownerHTML+=notificationCard(

"💰 Bill Requested",

`Table ${req.tableNumber}`,

"Cashier",

id,

"request",

"medium",

"cashier.html"

);

}

if(req.requestType==="Complaint"){

ownerCount++;

ownerHTML+=notificationCard(

"❗ Customer Complaint",

`Table ${req.tableNumber}`,

"Manager",

id,

"request",

"high",

"dashboard.html"

);

}

});

kitchenBox.innerHTML=
kitchenHTML||"<div class='empty'>No Notifications</div>";

waiterBox.innerHTML=
waiterHTML||"<div class='empty'>No Notifications</div>";

ownerBox.innerHTML=
ownerHTML||"<div class='empty'>No Notifications</div>";

document.getElementById("kitchenAlerts").innerText=kitchenCount;
document.getElementById("waiterAlerts").innerText=waiterCount;
document.getElementById("ownerAlerts").innerText=ownerCount;
document.getElementById("totalAlerts").innerText=
kitchenCount+waiterCount+ownerCount;

}

onSnapshot(collection(db,"orders"),function(snapshot){

ordersData=[];

snapshot.forEach(function(docu){

ordersData.push({

id:docu.id,
order:docu.data()

});

});

renderNotifications();

});

onSnapshot(collection(db,"requests"),function(snapshot){

requestsData=[];

snapshot.forEach(function(docu){

requestsData.push({

id:docu.id,
request:docu.data()

});

});

renderNotifications();

});

window.markRequestDone=async function(id){

await updateDoc(

doc(db,"requests",id),

{

status:"Completed"

}

);

};

</script>

</body>
</html>
